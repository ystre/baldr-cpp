name: Debug and coverage report

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  debug-coverage:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: turtlebrowser/get-conan@main
      with:
        version: "2.6.0"
    - name: Install GCC
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake gcovr
    - name: Install Nova
      run: |
        conan export deps/nova-cpp/libnova/
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=1 -DBUILD_TESTING=1 -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=${{github.workspace}}/env/conan_provider.cmake
        cmake --build ${{github.workspace}}/build --config Debug

